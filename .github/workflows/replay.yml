# Cross-platform replay check (DR-013): the reference config must produce the pinned state
# hash on every platform and at every thread count.
name: replay

on:
  push:
    branches: [master, "m*", studio]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Python experiment layer tests
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          cargo build --release --locked -p lab-cli
          if [ -f target/release/lab.exe ]; then export LAB_BIN="$PWD/target/release/lab.exe"; fi
          python -m unittest discover -s python/tests -v
      - name: Replay pinned worlds
        shell: bash
        run: |
          # name:ticks pairs; each config has a pinned hash in configs/<name>.sha256 (DR-013).
          for spec in reference:2000 crossfeed:1500 blackqueen:600 positive-control:600 negative-control:600 containment:1500; do
            name="${spec%%:*}"; ticks="${spec##*:}"
            expected="$(tr -d '[:space:]' < "configs/$name.sha256")"
            for threads in 1 4; do
              line="$(cargo run --release --locked -q -p lab-cli -- run "configs/$name.toml" --ticks "$ticks" --threads "$threads" --out "replay-$name-$threads" | tr -d '\r')"
              echo "$name threads=$threads: $line"
              actual="${line##*hash=}"
              if [ "$actual" != "$expected" ]; then
                echo "::error::$name state hash mismatch on ${{ matrix.os }} with $threads threads: expected $expected, got $actual"
                exit 1
              fi
            done
            echo "$name replay hash matches on ${{ matrix.os }}: $expected"
          done
      - name: Package the program with its Python layer and example worlds
        shell: bash
        run: |
          mkdir -p package/target/release
          if [ -f target/release/lab.exe ]; then cp target/release/lab.exe package/target/release/; else cp target/release/lab package/target/release/; fi
          cp -r configs experiments python docs README.md package/
          find package -name __pycache__ -type d -exec rm -rf {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lab-${{ runner.os }}-${{ runner.arch }}
          path: package
          if-no-files-found: error
