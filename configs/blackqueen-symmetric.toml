# Symmetric Black Queen world (exploration round 2, docs/experiments/EXPLORATION.md). A flows in
# and is turned into three things: E (private; pays upkeep, starvation), and B and C (both leaky,
# both needed with E to divide). The two public goods are exactly alike, so any asymmetry between
# them in a run comes from history, not from the chemistry.
# Stream numbers are the rule's position (sweeps refer to them: 8 metabolism, 11 division, 12 movement).
schema_version = 2
seed = 1

[world]
width = 48
height = 48
wrap = true
resources = ["E", "A", "B", "C"]

[init]
site_stock = [0, 200, 0, 0]
patches = []

[[init.founders]]
count = 800
stock = [60, 0, 60, 60]
genome = [
  { kind = "uptake", resource = "A", level = 90, sense = "always", threshold = 0 },
  { kind = "convert", from = "A", to = "E", level = 30, sense = "always", threshold = 0 },
  { kind = "convert", from = "A", to = "B", level = 30, sense = "always", threshold = 0 },
  { kind = "convert", from = "A", to = "C", level = 30, sense = "always", threshold = 0 },
  { kind = "uptake", resource = "B", level = 30, sense = "always", threshold = 0 },
  { kind = "uptake", resource = "C", level = 30, sense = "always", threshold = 0 },
]

[[rules]]
id = "influx.constant"
version = 1
stream = 1
params = { resource = "A", amount = 120, every = 1 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 2
params = { resource = "A", divisor = 8 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 3
params = { resource = "B", divisor = 8 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 4
params = { resource = "C", divisor = 8 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 5
params = { resource = "A", divisor = 20 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 6
params = { resource = "B", divisor = 10 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 7
params = { resource = "C", divisor = 10 }

[[rules]]
id = "metabolism.genes"
version = 3
stream = 8
params = { energy = "E", base_cost = 1, gene_cost = 1, yield_num = 3, yield_den = 4, reactions = [{ from = "A", to = "B", leak_ppm = 200000 }, { from = "A", to = "C", leak_ppm = 200000 }, { from = "A", to = "E", leak_ppm = 0 }], release_to = "site", guests_trade_with = "site" }

[[rules]]
id = "death.starvation"
version = 1
stream = 9
params = { resource = "E", recycle = true }

[[rules]]
id = "death.random"
version = 1
stream = 10
params = { probability_ppm = 5000, recycle = true }

[[rules]]
id = "reproduction.division"
version = 2
stream = 11
params = { requires = [{ resource = "E", threshold = 120 }, { resource = "B", threshold = 120 }, { resource = "C", threshold = 120 }], site_capacity = 4, mutation = { point_ppm = 20000, point_magnitude = 5, retarget_ppm = 2000, duplicate_ppm = 2000, delete_ppm = 10000, max_genes = 16, kinds = ["uptake", "convert", "secrete"] } }

[[rules]]
id = "move.random"
version = 1
stream = 12
params = { probability_ppm = 10000 }
