# Containment world (DR-022): the Black Queen world, plus entities that can live inside one another.
# Founders express a bind gene; free entities with matching bind genes may pair into host and guest.
# Guests take up from and leak into their host, move with it, share E and F with it, and may pass to
# the daughter when it divides. Nothing rewards containment: it costs a gene, and it persists only
# if the lineages that keep the gene do better. Nulls: null.no_sharing, null.random_partition.
# Stream numbers 1-12 match configs/blackqueen.toml; 13-16 are the containment rules.
schema_version = 2
seed = 1

[world]
width = 48
height = 48
wrap = true
resources = ["E", "F", "A", "B", "C"]

[init]
site_stock = [0, 0, 200, 0, 0]
patches = []

[[init.founders]]
count = 800
stock = [60, 60, 0, 0, 0]
genome = [
  { kind = "bind", resource = "A", level = 1, sense = "always", threshold = 0 },
  { kind = "uptake", resource = "A", level = 60, sense = "always", threshold = 0 },
  { kind = "convert", from = "A", to = "B", level = 30, sense = "always", threshold = 0 },
  { kind = "convert", from = "A", to = "C", level = 30, sense = "always", threshold = 0 },
  { kind = "uptake", resource = "B", level = 30, sense = "always", threshold = 0 },
  { kind = "uptake", resource = "C", level = 30, sense = "always", threshold = 0 },
  { kind = "convert", from = "B", to = "E", level = 30, sense = "always", threshold = 0 },
  { kind = "convert", from = "C", to = "F", level = 30, sense = "always", threshold = 0 },
]

[[rules]]
id = "influx.constant"
version = 1
stream = 1
params = { resource = "A", amount = 120, every = 1 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 2
params = { resource = "A", divisor = 8 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 3
params = { resource = "B", divisor = 8 }

[[rules]]
id = "diffusion.integer"
version = 1
stream = 4
params = { resource = "C", divisor = 8 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 5
params = { resource = "A", divisor = 20 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 6
params = { resource = "B", divisor = 10 }

[[rules]]
id = "decay.fraction"
version = 1
stream = 7
params = { resource = "C", divisor = 10 }

[[rules]]
id = "metabolism.genes"
version = 3
stream = 8
params = { energy = "E", base_cost = 1, gene_cost = 1, yield_num = 3, yield_den = 4, reactions = [{ from = "A", to = "B", leak_ppm = 200000 }, { from = "A", to = "C", leak_ppm = 200000 }, { from = "B", to = "E", leak_ppm = 0 }, { from = "C", to = "F", leak_ppm = 0 }], release_to = "site", guests_trade_with = "host" }

[[rules]]
id = "death.starvation"
version = 1
stream = 9
params = { resource = "E", recycle = true }

[[rules]]
id = "death.random"
version = 1
stream = 10
params = { probability_ppm = 5000, recycle = true }

[[rules]]
id = "containment.bind"
version = 1
stream = 13
params = { probability_ppm = 20000, max_guests = 3 }

[[rules]]
id = "containment.share"
version = 1
stream = 14
params = { resources = ["E", "F"], divisor = 4 }

[[rules]]
id = "reproduction.division"
version = 2
stream = 11
params = { requires = [{ resource = "E", threshold = 120 }, { resource = "F", threshold = 120 }], site_capacity = 4, mutation = { point_ppm = 20000, point_magnitude = 5, retarget_ppm = 2000, duplicate_ppm = 2000, delete_ppm = 10000, max_genes = 16, kinds = ["uptake", "convert", "secrete", "bind"] } }

[[rules]]
id = "containment.partition"
version = 1
stream = 15
params = { probability_ppm = 500000, mode = "lineage", max_guests = 3 }

[[rules]]
id = "containment.release"
version = 1
stream = 16
params = { probability_ppm = 2000 }

[[rules]]
id = "move.random"
version = 1
stream = 12
params = { probability_ppm = 10000 }
