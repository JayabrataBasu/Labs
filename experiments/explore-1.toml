# EXPLORATORY round 1 (DR-019): where does dependence evolve, and where do complementary
# dependants coexist, in the Black Queen world? Seeds below 1000: cannot be registered.
name = "explore-1"
base_config = "../configs/blackqueen.toml"
ticks = 5000
series_every = 500
threads = 1
seeds = [1, 2, 3]
primary_outcome = "complementary"
aim = "Find how leak, gene cost and motility shape evolved dependence."
estimand = "Share of runs with complementary coexistence and mean dependent fraction per cell."
analysis_plan = "Exploratory: no inference. Use to choose a registered design."

[observe]
window = 10
count = 3
flux_radius = 1
contact_radius = 0
min_share = 0.05
min_fraction = 0.05
permutations = 10
shuffle_seed = 1
counterfactual_pairs = 0
counterfactual_ticks = 100
max_flux_pairs = 2000000
keep_raw = false

[[arms]]
name = "intact"
transforms = []

[[sweeps]]
name = "leak"
paths = ["rules.8.params.reactions.0.leak_ppm", "rules.8.params.reactions.1.leak_ppm"]
values = [50000, 200000, 500000]

[[sweeps]]
name = "genecost"
path = "rules.8.params.gene_cost"
values = [0, 1, 2]

[[sweeps]]
name = "move"
path = "rules.12.params.probability_ppm"
values = [0, 10000, 200000]
