# First RQ1 design (PROPOSAL §3.2): does the cross-feeding world sustain a population, and what do
# the null worlds do? This is an exploratory starting design, not a registered one: freeze it
# (`python -m evolab freeze experiments/rq1-baseline.toml`) only after the settings are chosen.
name = "rq1-baseline"
base_config = "../configs/crossfeed.toml"
ticks = 2000
series_every = 200
threads = 1
seeds = [1, 2, 3, 4, 5]
primary_outcome = "entities"
analysis_plan = "Compare the distribution over seeds of final population size and of secrete_genes between the intact world and N1 (no interaction), N2 (well mixed) and N5 (no mutation). Report medians and ranges; no significance claims until the construct check passes."

[[arms]]
name = "intact"
transforms = []

[[arms]]
name = "N1_no_interaction"
transforms = [{ name = "null.no_secretion" }]

[[arms]]
name = "N2_well_mixed"
transforms = [{ name = "null.well_mixed" }]

[[arms]]
name = "N5_no_mutation"
transforms = [{ name = "null.no_mutation" }]
