[package]
name = "lab-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
lab-core = { path = "../lab-core" }
lab-rules = { path = "../lab-rules" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lab-rng = { path = "../lab-rng" }
