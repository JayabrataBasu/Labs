[package]
name = "lab-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
lab-core = { path = "../lab-core" }
lab-rules = { path = "../lab-rules" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "0.8"

[dev-dependencies]
proptest = "1"
lab-rng = { path = "../lab-rng" }
